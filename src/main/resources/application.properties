server.port=${SERVER_PORT:8088}
spring.application.name=ife-correlated-vulnerable-app

# Small HTTP worker pool makes thread saturation easy to reproduce.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# In-memory DB; the application-level gate deliberately simulates a constrained DB resource.
spring.datasource.url=jdbc:h2:mem:ife;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000

management.endpoints.web.exposure.include=health,info,metrics,threaddump,heapdump
logging.file.name=logs/ife-application.log
logging.level.com.ife.demo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.apache.catalina=DEBUG
